name: Daily trend report

on:
  schedule:
    # 09:10 Asia/Shanghai ~= 01:10 UTC
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate report and update site
        run: node scripts/daily_update.mjs

      - name: Commit and push (if changed)
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css DAILY_UPDATE.md *.md
          git commit -m "Update trend report $(date +%F)"
          git push

