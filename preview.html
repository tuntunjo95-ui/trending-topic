<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>趋势报告可视化预览</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <div>
        <p class="eyebrow">Preview</p>
        <h1>趋势报告可视化预览</h1>
      </div>
      <div class="top-actions">
        <a class="button" href="./index.html">返回主页</a>
      </div>
    </header>

    <main id="main" class="layout">
      <aside class="sidebar" aria-label="预览筛选">
        <section class="panel">
          <h2>报告选择</h2>
          <label class="search-box sidebar-search">
            <span>日期</span>
            <select id="pvReportSelect" aria-label="Report date"></select>
          </label>
          <p id="pvReportMeta" class="helper-text" aria-live="polite"></p>
        </section>

        <section class="panel">
          <h2>国家选择</h2>
          <label class="search-box sidebar-search">
            <span>国家</span>
            <select id="pvCountrySelect" aria-label="Country"></select>
          </label>
          <p class="helper-text">选择“全部”将显示 6 国汇总。</p>
        </section>

        <section class="panel compact">
          <h2>展示内容</h2>
          <div class="filter-list">
            <button class="filter-chip active" data-pv-tab="topics" type="button">选题卡片</button>
            <button class="filter-chip" data-pv-tab="threads" type="button">Threads 探针</button>
            <button class="filter-chip" data-pv-tab="ig" type="button">IG 代理</button>
          </div>
          <p class="helper-text">注：Threads/IG 探针为试运行启发式，不代表官方趋势榜。</p>
        </section>

        <section class="panel">
          <h2>人工回填</h2>
          <div class="filter-list">
            <button id="pvEditToggle" class="filter-chip" type="button">进入编辑</button>
            <button id="pvExportSignals" class="filter-chip" type="button">导出内容 JSON</button>
            <button id="pvExportOverrides" class="filter-chip" type="button">导出分类 JSON</button>
          </div>
          <p class="helper-text">
            说明：把 Threads/TikTok 的热门链接手动粘贴进来，然后导出 JSON 文件，保存到
            <code>scripts/</code> 目录（文件名含日期）再运行生成器。
          </p>
        </section>
      </aside>

      <section class="content">
        <section class="hero">
          <div>
            <p id="pvEyebrow" class="eyebrow">—</p>
            <h2 id="pvTitle">—</h2>
            <p id="pvSubtitle">—</p>
          </div>
          <div class="hero-metrics" aria-label="汇总指标">
            <div><strong id="pvTopicCount">0</strong><span>总选题</span></div>
            <div><strong id="pvLowCount">0</strong><span>低风险</span></div>
            <div><strong id="pvWatchCount">0</strong><span>风险观察</span></div>
          </div>
        </section>

        <section class="toolbar" aria-label="预览工具栏">
          <div class="segmented" role="group" aria-label="风险筛选">
            <button class="active" data-pv-risk="all" type="button">全部</button>
            <button data-pv-risk="low" type="button">低风险</button>
            <button data-pv-risk="watch" type="button">风险观察</button>
          </div>
          <label class="search-box">
            <span>搜索</span>
            <input id="pvSearch" type="search" placeholder="话题、国家、分类" />
          </label>
        </section>

        <section id="pvContent" class="country-sections" aria-live="polite"></section>
      </section>

      <aside class="rightbar">
        <section class="panel">
          <h2>优先深挖（原始）</h2>
          <ol id="pvPriority" class="priority-list"></ol>
        </section>
        <section class="panel">
          <h2>风险观察池（原始）</h2>
          <div id="pvRiskPool" class="risk-list"></div>
        </section>
      </aside>
    </main>

    <dialog id="pvEditor" class="pv-dialog">
      <form method="dialog" class="pv-dialog-inner">
        <header class="pv-dialog-head">
          <div>
            <p class="eyebrow">Manual Verify</p>
            <h2 id="pvEditorTitle">—</h2>
            <p id="pvEditorMeta" class="helper-text">—</p>
          </div>
          <button class="button" value="cancel" type="submit">关闭</button>
        </header>

        <div class="pv-form">
          <label>
            <span>二次确认分类（可选）</span>
            <select id="pvEditorType">
              <option value="">不覆盖</option>
              <option value="Sports / Event">Sports / Event</option>
              <option value="Drama / Variety / Entertainment">Drama / Variety / Entertainment</option>
              <option value="Music / Show / Release">Music / Show / Release</option>
              <option value="Celebrity / Fandom">Celebrity / Fandom</option>
              <option value="Brand / Consumer">Brand / Consumer</option>
              <option value="Travel / Local Event">Travel / Local Event</option>
              <option value="General / To Classify">General / To Classify</option>
            </select>
          </label>

          <label>
            <span>风险（可选）</span>
            <select id="pvEditorRisk">
              <option value="">不覆盖</option>
              <option value="Low">Low</option>
              <option value="Political / Controversy">Political / Controversy</option>
              <option value="Legal / Fraud">Legal / Fraud</option>
              <option value="Medical / Sensitive">Medical / Sensitive</option>
              <option value="Disaster / Memorial">Disaster / Memorial</option>
              <option value="Speculation / Crypto-Shill Risk">Speculation / Crypto-Shill Risk</option>
              <option value="Adult / Low-Quality Ad Risk">Adult / Low-Quality Ad Risk</option>
            </select>
          </label>

          <label>
            <span>Threads Top（每行 1 个链接）</span>
            <textarea id="pvEditorThreadsTop" rows="4" placeholder="https://www.threads.com/..."></textarea>
          </label>

          <label>
            <span>Threads Recent（每行 1 个链接）</span>
            <textarea id="pvEditorThreadsRecent" rows="3" placeholder="https://www.threads.com/..."></textarea>
          </label>

          <label>
            <span>TikTok Top（每行 1 个链接）</span>
            <textarea id="pvEditorTikTokTop" rows="4" placeholder="https://www.tiktok.com/@.../video/..."></textarea>
          </label>

          <label>
            <span>TikTok Recent（每行 1 个链接）</span>
            <textarea id="pvEditorTikTokRecent" rows="3" placeholder="https://www.tiktok.com/@.../video/..."></textarea>
          </label>

          <label>
            <span>备注（可选）</span>
            <input id="pvEditorNote" type="text" placeholder="例如：Top tab 取前 3 条" />
          </label>
        </div>

        <footer class="pv-dialog-foot">
          <button id="pvEditorSave" class="button primary" value="default" type="submit">保存</button>
          <button id="pvEditorClear" class="button" value="default" type="button">清空此条</button>
        </footer>
      </form>
    </dialog>

    <script src="./app.js?v=202605201739"></script>
    <script src="./preview.js"></script>
  </body>
</html>
